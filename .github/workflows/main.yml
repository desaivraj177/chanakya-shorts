name: Daily 2 YouTube Shorts Automation

on:
  schedule:
    # रोज़ सुबह 9:00 बजे और शाम 6:00 बजे (IST) अपने आप चलेगा
    - cron: '30 3 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch: # जब चाहें बटन दबाकर भी चला सकते हैं

jobs:
  make-and-upload-short:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg, Hindi Fonts & Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
          pip install google-generativeai edge-tts requests google-api-python-client google-auth-oauthlib

      - name: Generate and Upload Animated Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py

      - name: Update Remaining Topics List
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@github.com"
          git add topics.txt
          git commit -m "Completed 1 Chanakya Niti topic" || exit 0
          git push
